  #     would then error every hour: if a tenant genuinely has no PM/TPM-ish
  #     postings at all, it does not belong on this list yet. Post the same
  #     query the poller does (limit 20, offset 0, searchText "product manager"
  #     then "technical program manager") and require rows back from at least
