# Layer 1 ATS polling targets — companies whose boards get checked hourly.
# board: greenhouse | lever | ashby | workday | custom
# slug: the company's board identifier in the ATS URL (verify each — visit the
#   company's careers page, view a job posting, and the ATS + slug are in the URL).
# For `custom` (own career portals like Meta/Google/Microsoft), Layer 1 falls
#   back to JobSpy discovery — they can't be polled directly.
# title_filter: regex applied to job titles from this company (keeps queue clean).

defaults:
  # 2026-10-08: product owner / analyst / operations and the adjacent families
  # (FDE, developer relations) were dropped here before insert while JobSpy's
  # JOBSPY_RELEVANT already admitted them. APM and TPM are word-bounded now.
  # Single-quoted so YAML passes the backslashes through untouched.
  title_filter: '(?i)(product\s+(manager|owner|analyst|operations)|program\s+manager|\bAPM\b|\bTPM\b|forward[\s-]+deployed|developer\s+(relations|advocate))'
  # Keep-filter: US signals only. State codes word-bounded (bare "US"/"CA" used to
  # match "Australia"/"Canada"); major cities listed because some boards (e.g.
  # Ashby/Plaid) return bare city names with no state. Fixed 2026-08-11.
  location_filter: "(?i)(united states|\\bUSA?\\b|remote|\\b(NH|NY|CA|WA|TX|MA|IL|CO|GA|FL|PA|NC|VA|UT|OR|AZ|TN|DC|NJ|CT|MN|MI|OH|MO|WI)\\b|new york|san francisco|seattle|austin|boston|chicago|denver|atlanta|los angeles|salt lake|portland|miami|dallas|phoenix|raleigh|nashville|columbus|charlotte)"

# Sources already known to be dead, with the date and the reason. They still show
# in the run table and in the run summary as `known_degraded=`, but they do NOT
# colour the dashboard clock and do NOT raise a per-run warning annotation.
#
# Why this list has to exist: an alarm that is on permanently is exactly as
# informative as one that is never on, and it trains the reader to skip the whole
# area — including the states that still work. Same reasoning as the attestation
# queue's `closed-unavailable` outcome and the standing dispositions file: a known
# condition must be recorded once and then stop costing attention. Remove an entry
# to make that source loud again.
acknowledged_degraded:
  - source: "jobspy[google]"
    since: "2026-08-11"
    why: >-
      JobSpy's Google Jobs scraper returns 0 rows for every search term. Upstream
      breakage in python-jobspy, not a config error here and not fixable from this
      repo. Indeed still carries the breadth layer.
      Re-tested 2026-08-23 with the documented natural-language google_search_term
      ("<term> jobs in United States since yesterday") in place of the known-broken
      "<term> jobs USA": still 0 rows, for both "product manager" and "technical
      program manager". The scraper logs "initial cursor not found", i.e. it can no
      longer locate the pagination cursor in Google's response at all — a query
      shape cannot fix that. scrape.py now sends the correct syntax anyway, so if
      upstream repairs the parser this source recovers without a code change; drop
      this entry when it does.

  - source: "jobright:h1b"
    since: "2026-08-23"
    why: >-
      Upstream stopped rebuilding jobright-ai/Daily-H1B-Jobs-In-Tech on
      2026-05-06 — last commit that day, and the newest row in the file is dated
      2026-05-06 too. Every row is therefore months past the 72h ingest window,
      so this feed contributes 0 rows on every run and will keep doing so until
      the repo revives. Nothing here is broken: the poller fetches and parses all
      1,424 rows cleanly.
      Acknowledging it silences the one error this source can raise — "no job
      rows parsed", which fires when the table layout or filename moves — so a
      real upstream reshuffle would go unannounced. That is the accepted cost: a
      feed contributing nothing cannot be made worse by a parse break, and the
      run table still names the newest row in the file every hour, which is the
      readout that will show the repo coming back to life.
      The live replacement for Vaish's lane is "jobright:pm-newgrad"
      (jobright-ai/2026-Product-Management-New-Grad), added the same day and
      deliberately NOT acknowledged: it is current and must stay loud. Drop this
      entry if the H1B repo starts updating again — its sponsorship flag is a
      signal no other source here carries.

