  #     Mastercard or Capital One PM role only ever arrived if Indeed caught it.
  #
  #     ADDING A TENANT: confirm it with a NON-ZERO result count, never with
  #     HTTP 200. A renamed tenant or a moved site answers 200 with an empty
  #     jobPostings list, which is indistinguishable from a quiet board from the
  #     outside — and fetch_workday RAISES when a board yields zero postings
  #     across BOTH search terms, precisely so that failure is loud. That guard
